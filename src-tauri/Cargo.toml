[package]
name = "mavis"
version = "0.1.0"
description = "Mavis - Floating Notch Voice Assistant Overlay"
authors = ["Mohammad Hossein Yaghobi"]
edition = "2021"

[lib]
name = "mavis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0.0"
rdev = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
cairo-rs = "0.18"
